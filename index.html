<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドンキAD 店舗検索</title>
    <!-- ファビコン(ブラウザのタブに出るアイコン)。index.htmlと同じ階層の favicon.ico を読み込む。?v=1 は古いキャッシュ対策 -->
    <link rel="icon" href="./favicon.ico?v=1" sizes="any">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css?v=ui13">
</head>
<body>
    <!-- 読み込み中の表示 -->
    <div id="loading-overlay" role="status" aria-live="polite">
        <div class="spinner"></div>
        <div class="loading-text">最新のデータを読み込んでいます…</div>
    </div>
    <div id="error-banner"></div>
    
    <div id="app-container">

        <!-- ① ヘッダー (ハンバーガーメニュー) -->
        <div id="header">
            <div class="font-bold italic text-yellow-400 text-xl">DONKI AD <span class="text-white text-sm not-italic">MAP</span></div>
            <button id="menu-btn" class="hamburger-btn" onclick="toggleMenu()">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
        <div id="menu-overlay" onclick="toggleMenu()"></div>
        <div id="dropdown-menu" class="dropdown-menu"></div>

        <!-- ② ヘッダーバナーゾーン (比率維持・見切れなし) -->
        <img id="header-banner" src="" alt="Header Banner" style="display:none;">
        
        <!-- ③ 申込スケジュール -->
        <section id="deadline-zone" class="zone view-hidden">
            <div class="zone-title"><span class="zone-dot"></span>申込スケジュール</div>
            <div id="deadline-list"></div>
        </section>

        <!-- ④-1 商材を選択 -->
        <section id="product-select-zone" class="zone">
            <div class="zone-title"><span class="zone-dot"></span>商材を選択</div>
            <div class="product-tabs" id="product-tabs"></div>
        </section>

        <!-- ④-2 掲載開始の目安 -->
        <details id="start-acc" class="zone acc-zone">
            <summary id="start-summary"></summary>
            <div id="start-content" class="acc-body"></div>
        </details>

        <!-- ④-3 商材情報・料金 -->
        <details id="price-acc" class="zone acc-zone">
            <summary><span class="zone-dot"></span><span class="acc-title">商材情報・料金</span><span id="price-summary" class="acc-sub"></span></summary>
            <div id="product-content" class="acc-body"></div>
        </details>

        <!-- ⑤ 検索・ソートゾーン -->
        <section id="search-panel" class="zone">
            <div class="search-head" onclick="toggleSearch()">
                <div class="search-head-main">
                    <div class="search-head-title">🔍 検索・絞り込み</div>
                    <div id="search-summary" class="search-summary">全国の店舗</div>
                </div>
                <svg id="search-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
            </div>

            <div id="search-contents" class="view-hidden">
                <div class="search-left">
                <div class="seg seg-sm" id="mode-seg">
                    <button type="button" id="mode-region" class="active" onclick="setSearchMode('region')">エリア</button>
                    <button type="button" id="mode-radius" onclick="setSearchMode('radius')">半径</button>
                    <button type="button" id="mode-keyword" onclick="setSearchMode('keyword')">キーワード</button>
                </div>

                <div id="pane-region" class="search-pane">
                    <div class="flex gap-2">
                        <select id="pref-select" class="stylish-select w-1/2" onchange="updateCities();"><option value="">都道府県</option></select>
                        <select id="city-select" class="stylish-select w-1/2"><option value="">市区町村</option></select>
                    </div>
                    <button type="button" class="apply-btn" onclick="applyRegion()">この条件で検索</button>
                </div>

                <div id="pane-radius" class="search-pane view-hidden">
                    <div class="seg seg-sm">
                        <button type="button" id="center-current" class="active" onclick="setCenterType('current')">現在地から</button>
                        <button type="button" id="center-point-btn" onclick="setCenterType('point')">地点を指定</button>
                    </div>
                    <div id="center-point" class="view-hidden">
                        <div class="addr-row">
                            <input type="text" id="addr-input" placeholder="住所・駅名・地名(例: 名古屋駅)" onkeydown="onEnterKey(event, searchAddress)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
                            <button type="button" class="addr-btn" onclick="searchAddress()">地点を探す</button>
                        </div>
                        <div id="addr-results"></div>
                    </div>
                    <div id="center-label" class="center-label">基準: 現在地</div>
                    <div class="radius-row">
                        <input type="number" id="radius-input" placeholder="半径を入力" inputmode="decimal" onkeydown="onEnterKey(event, applyRadius)" autocomplete="off" enterkeyhint="search">
                        <span class="radius-unit">km以内</span>
                    </div>
                    <div class="chip-row" id="radius-chips"></div>
                    <button type="button" class="apply-btn" onclick="applyRadius()">この条件で検索</button>
                </div>

                <div id="pane-keyword" class="search-pane view-hidden">
                    <input type="text" id="keyword-input" class="kw-input" placeholder="店舗名・住所・市区町村(スペースで複数指定)" onkeydown="onEnterKey(event, applyKeyword)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
                    <button type="button" class="apply-btn" onclick="applyKeyword()">この条件で検索</button>
                </div>

                </div>
                <div class="search-right">
                <div class="search-sub">カテゴリ</div>
                <div class="flex gap-2 overflow-x-auto pb-1 items-center" id="category-filters" style="-webkit-overflow-scrolling: touch;"></div>

                <div class="toggle-wrapper mt-2">
                    <label class="toggle-switch">
                        <input type="checkbox" id="show-unavailable" checked onchange="filterMap();"><span class="slider"></span>
                    </label>
                    <span class="font-bold text-gray-700 text-sm">掲載不可店舗も表示する</span>
                    <button type="button" id="reset-btn" onclick="resetFilters()">リセット</button>
                </div>
                </div>
            </div>

            <!-- 並び替え -->
            <div id="sort-row" class="sort-row view-hidden">
                <span class="sort-label">並び替え</span>
                <select id="sort-select" class="stylish-select" onchange="renderStoreList(true)">
                    <option value="distance">近い順(現在地・指定地点から)</option>
                    <option value="updated">更新日が新しい順</option>
                    <option value="pref">都道府県順</option>
                    <option value="name">店舗名順</option>
                </select>
            </div>
        </section>

        <!-- ⑤-2 店舗単位の注意文 -->
        <div id="warn-zone"><div id="warn-content" class="g-warn-box"></div></div>

        <!-- ⑥ リスト／MAP 切り替えボタン -->
        <div id="view-toggle">
            <div class="seg">
                <button type="button" id="seg-list" onclick="setView('list')">リスト</button>
                <button type="button" id="seg-map" class="active" onclick="setView('map')">MAP</button>
            </div>
            <div id="result-count">- 件</div>
        </div>

        <!-- ⑦ 店舗情報が表示されるゾーン(リスト) -->
        <div id="list-view" class="view-hidden">
            <div id="store-list"></div>
            <button type="button" id="list-more" onclick="showMoreStores()" style="display:none;">さらに表示</button>
        </div>

        <!-- ⑦ 店舗情報が表示されるゾーン(MAP) -->
        <div id="map-container">
            <div id="map"></div>
            <button id="gps-btn" onclick="recenterMap()" title="現在地に戻る">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" /></svg>
            </button>
        </div>
    </div>
    
    <script>
    (function () {
        function show(msg) {
            var eb = document.getElementById('error-banner'); if (!eb) return;
            eb.textContent = (eb.textContent ? eb.textContent + ' / ' : '') + msg; eb.style.display = 'block';
        }
        window.hideLoading = function () {
            var o = document.getElementById('loading-overlay'); if (!o) return;
            o.classList.add('hide'); setTimeout(function () { o.style.display = 'none'; }, 400);
        };
        setTimeout(window.hideLoading, 30000); 
        window.addEventListener('error', function (e) {
            if (!e.message || e.message === 'Script error.') return;   
            var f = (e.filename || '').split('/').pop().split('?')[0];
            if (f && f !== 'app.js' && f !== 'index.html') return;
            show('⚠ エラー: ' + e.message + (f ? ' (' + f + ' ' + e.lineno + '行目)' : ''));
            window.hideLoading();
        });
        window.addEventListener('unhandledrejection', function (e) { show('⚠ 通信エラー: ' + ((e.reason && e.reason.message) || e.reason)); });
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (typeof initApp !== 'function' || window.__APP_VERSION !== 'ui13') show('⚠ app.js を読み込めていません(ファイルが途中で切れている、またはアップロードできていない可能性があります)');
                if (typeof L === 'undefined') show('⚠ 地図ライブラリ(Leaflet)を読み込めていません。通信環境を確認してください');
            }, 1500);
        });
    })();
    </script>
    <script src="app.js?v=ui13" charset="utf-8"></script>
</body>
</html>

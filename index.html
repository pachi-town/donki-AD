<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドンキAD MAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="error-banner"></div>
    <div id="app-container">
        <div id="header">
            <div class="font-bold italic text-yellow-400 text-xl">DONKI AD <span class="text-white text-sm not-italic">MAP</span></div>
            <a href="#" class="bg-white text-black text-xs px-3 py-1 rounded-full font-bold flex items-center gap-1">他ツール</a>
        </div>
        <img id="header-banner" src="" alt="Header Banner" style="display:none;">

        <div id="search-panel">
            <div class="flex justify-between items-center mb-1" onclick="toggleSearch()" style="cursor: pointer;">
                <div class="font-bold flex items-center gap-2">🔍 検索・絞り込み</div>
                <svg id="search-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
            </div>
            <div id="search-contents" class="space-y-3 hidden mt-3">
                <div class="flex items-center w-full bg-gray-50 border border-gray-200 rounded-lg overflow-hidden">
                    <input type="number" id="radius-input" class="w-full bg-transparent px-3 py-2.5 text-sm outline-none text-gray-800" placeholder="現在地からの距離を入力" oninput="filterMap()">
                    <span class="text-xs text-gray-500 font-bold px-3 border-l border-gray-200 whitespace-nowrap bg-gray-100 py-3">km以内</span>
                </div>
                
                <div class="flex gap-2">
                    <select id="pref-select" class="stylish-select w-1/2" onchange="updateCities(); filterMap();"><option value="">都道府県</option></select>
                    <select id="city-select" class="stylish-select w-1/2" onchange="filterMap();"><option value="">市区町村</option></select>
                </div>

                <div class="flex gap-2 overflow-x-auto pb-1 items-center" id="category-filters" style="-webkit-overflow-scrolling: touch;"></div>
                
                <div class="toggle-wrapper mt-2">
                    <label class="toggle-switch">
                        <input type="checkbox" id="show-unavailable" checked onchange="filterMap();"><span class="slider"></span>
                    </label>
                    <span class="font-bold text-gray-700 text-sm">掲載不可店舗も表示する</span>
                </div>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
            <button id="gps-btn" onclick="recenterMap()" title="現在地に戻る">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" /></svg>
            </button>
            <button id="floating-btn" onclick="openModal()">商材情報・料金を見る</button>
        </div>

        <div id="modal-overlay" onclick="closeModal()"></div>

        <div id="bottom-modal">
            <div class="modal-handle" onclick="closeModal()"></div>
            <div class="modal-tabs" id="modal-tabs"></div>
            <div class="modal-content" id="modal-content"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
